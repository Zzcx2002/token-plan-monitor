[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-plan-monitor"
version = "0.1.0"
description = "A lightweight Windows tray monitor for Volcengine Ark plan quotas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "pystray>=0.19,<1",
    "Pillow>=10,<13",
    "keyring>=24,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
token-plan-monitor = "token_plan_monitor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
markers = [
    "live: opt-in tests that call the real Volcengine OpenAPI",
]
